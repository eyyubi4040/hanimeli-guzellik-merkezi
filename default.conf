server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 301 Permanent Redirect: /index.html -> /
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 /$1;
    }

    # 301 Permanent Redirect: any-page.html -> /any-page
    if ($request_uri ~ ^/(.+)\.html(\?.*)?$) {
        return 301 /$1$2;
    }

    # Clean URLs: try file as-is, as directory, as .html file, or fallback
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Static assets caching for fast performance
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff2|woff)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
